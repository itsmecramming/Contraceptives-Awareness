<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3cc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#005f73" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M50 5 L90 20 L90 50 C90 75 50 95 50 95 C50 95 10 75 10 50 L10 20 Z" fill="url(#shieldGradLight)" stroke="#007c91" stroke-width="3" filter="url(#glowLight)"/>
  
  <!-- Inner Detail Lines -->
  <path d="M50 15 L80 27 L80 50 C80 70 50 85 50 85 C50 85 20 70 20 50 L20 27 Z" fill="none" stroke="#007c91" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Medical Cross Base -->
  <path d="M42 35 L58 35 L58 45 L68 45 L68 60 L58 60 L58 70 L42 70 L42 60 L32 60 L32 45 L42 45 Z" fill="#ffffff" stroke="#007c91" stroke-width="2"/>

  <!-- EKG Pulse Line Overlay -->
  <polyline points="20,55 35,55 42,35 50,75 58,55 80,55" fill="none" stroke="#007c91" stroke-width="3" filter="url(#glowLight)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
